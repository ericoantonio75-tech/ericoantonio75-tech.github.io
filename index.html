<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Simulação Mágica</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
}

#simulacaoContainer {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.telefone {
    width: 250px;
    height: 400px;
    border: 3px solid cyan;
    border-radius: 20px;
    background: #1c1c1c;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    margin: 10px;
    padding: 10px;
}

h2 {
    margin-bottom: 10px;
}

#telaB {
    flex: 1;
    width: 100%;
    background: #222;
    margin-top: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 80px;
    border-radius: 10px;
    color: lime;
}

input, button {
    margin-top: 10px;
    padding: 8px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
}

button {
    cursor: pointer;
    font-weight: bold;
}

.permitir {
    background: lime;
    color: black;
}

.pedir {
    background: cyan;
    color: black;
}
</style>
</head>
<body>

<h1>Simulação Mágica A → B</h1>

<div id="simulacaoContainer">
    <!-- Telefone A -->
    <div class="telefone">
        <h2>Telefone A</h2>
        <input type="text" id="magicInput" placeholder="Digite o emoji mágico">
        <button class="pedir" onclick="ativarMagia()">Ativar Magia</button>
        <p id="statusA">Esperando ação...</p>
    </div>

    <!-- Telefone B -->
    <div class="telefone">
        <h2>Telefone B</h2>
        <div id="telaB">🕐</div>
        <button class="permitir" onclick="permitirControle()">Permitir</button>
    </div>
</div>

<script>
const emojiMagico = "🏴‍☠️"; // O emoji ou texto secreto que ativa a magia

function ativarMagia() {
    const input = document.getElementById("magicInput").value.trim();
    const telaB = document.getElementById("telaB");
    const statusA = document.getElementById("statusA");

    if(input === emojiMagico) {
        telaB.innerText = emojiMagico;
        statusA.innerText = "✨ Magia ativada! Emoji enviado para B!";
        document.getElementById("magicInput").value = "";
    } else {
        statusA.innerText = "Código errado. Tente novamente.";
    }
}

function permitirControle() {
    const telaB = document.getElementById("telaB");
    document.getElementById("statusA").innerText = "Controle concedido!";
    telaB.innerHTML = "<p>Controle concedido!</p>";
}
</script>

</body>
</html>
